<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<!-- Shared <head>. Pages pull this in with th:replace. -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' — Aula'">Aula</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>
<!-- Shared masthead. th:href="@{...}" builds context-aware URLs. -->
<header th:fragment="masthead" class="masthead">
    <a class="wordmark" th:href="@{/}">Aula<span>.</span></a>
    <nav>
        <a th:href="@{/}">Progress</a>
        <a th:href="@{/practice}">Practice</a>
        <form th:action="@{/logout}" method="post" style="display:inline">
            <button type="submit" class="linkbtn">Sign out</button>
        </form>
    </nav>
</header>
</body>
</html>
